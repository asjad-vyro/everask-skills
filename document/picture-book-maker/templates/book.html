<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>BOOK TITLE</title>
<style>
/* Set the 2 colours. Every .page is exactly one PDF page. */
:root{--bg:#fff9ec;--ink:#2b2b3a;--accent:#e4572e}
@page{size:1200px 900px;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px}
body{font-family:"Noto Sans","Noto Sans CJK SC","Noto Naskh Arabic",-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:1200px;height:900px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;page-break-after:always;break-after:page;position:relative}
.page:last-child{page-break-after:auto;break-after:auto}
.pic{height:540px;width:1200px;background:#e9e2d0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .missing{font-size:34px;padding:60px;text-align:center;color:#6b6552}
.text{flex:1;min-height:0;display:flex;align-items:center;padding:0 90px 40px;font-size:40px;line-height:1.35}
.num{position:absolute;bottom:22px;inset-inline-end:40px;font-size:26px;color:var(--accent)}
/* cover */
.cover .pic{height:620px}
.cover .text{flex-direction:column;justify-content:center;text-align:center;gap:10px}
.cover h1{font-size:76px;line-height:1.1;color:var(--accent)}
.cover .by{font-size:34px}
/* last page */
.end{align-items:center;justify-content:center;text-align:center}
.end h1{font-size:90px;color:var(--accent)}
.end p{font-size:38px;margin-top:20px}
</style>
</head>
<body>

<!-- Cover. The picture is cover.png. Delete the "by" div if there is nothing to put there. -->
<section class="page cover">
  <div class="pic"><img src="cover.png" alt=""></div>
  <div class="text"><h1>BOOK TITLE</h1><div class="by">FOR OR BY LINE, ONLY IF GIVEN</div></div>
</section>

<!-- One block per scene, in story order. Copy the block. Picture is scene-N.png.
     If a picture failed, replace the <img> with <div class="missing">Picture to come: short description</div>. -->
<section class="page">
  <div class="pic"><img src="scene-1.png" alt=""></div>
  <div class="text"><p>SCENE TEXT, 20 to 45 words.</p></div>
  <div class="num">2</div>
</section>

<!-- Last page -->
<section class="page end">
  <h1>THE END</h1>
  <p>OPTIONAL ONE-LINE MESSAGE</p>
</section>

<script>
/* Shrink any scene text that would not fit above the bottom margin (the user's words are never cut). */
document.querySelectorAll('.page:not(.cover):not(.end) .text').forEach(function(t){
  var p=t.querySelector('p'); if(!p) return; var f=40;
  while(f>26 && p.scrollHeight>t.clientHeight-40){f-=2;t.style.fontSize=f+'px';}
});
</script>
</body>
</html>
