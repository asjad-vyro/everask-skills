<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<title>{{DOC_TITLE}}</title>
<style>
@page { size: {{W}}px {{H}}px; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: {{W}}px; height: {{H}}px; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact;
  font-family: "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK KR", "Noto Naskh Arabic", sans-serif;
  color: #1b1b1f; }
.page { --lab: {{LAB}}; --u: {{U}}px; --accent: {{ACCENT}}; --accent-dark: {{ACCENT_DARK}};
  position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #fffdf8; }
.bg { position: absolute; inset: 0; {{BG_CSS}} }
.shade { position: absolute; inset: 0; background: {{SHADE}}; }
.band { position: absolute; top: 0; left: 0; right: 0; height: calc(var(--u) * 3); background: var(--accent); }
.content { position: relative; height: 100%; padding: calc(var(--u) * 8) calc(var(--u) * 8) calc(var(--u) * 7);
  display: flex; flex-direction: column; justify-content: space-between; color: {{TEXT}}; }
.kicker { font-size: calc(var(--u) * 3.2); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--lab); }
.hero { margin-top: calc(var(--u) * 3); }
h1 { font-size: calc(var(--u) * {{TITLE_SCALE}}); line-height: 1.04; font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; }
.sub { margin-top: calc(var(--u) * 3); font-size: calc(var(--u) * 4.2); line-height: 1.3; font-weight: 500; }
.details { margin-top: calc(var(--u) * 5); border-top: calc(var(--u) * .6) solid var(--accent); }
.row { display: flex; gap: calc(var(--u) * 3); align-items: baseline; padding: calc(var(--u) * 2.2) 0;
  border-bottom: 1px solid rgba(127,127,127,.35); }
.label { flex: 0 0 22%; font-size: calc(var(--u) * 2.8); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--lab); }
.value { flex: 1; font-size: calc(var(--u) * 5); font-weight: 700; line-height: 1.2; }
.prices { margin-top: calc(var(--u) * 4); }
.price { display: flex; justify-content: space-between; gap: calc(var(--u) * 3); font-size: calc(var(--u) * 4.4); font-weight: 600;
  padding: calc(var(--u) * 1.4) 0; border-bottom: 1px dotted rgba(127,127,127,.6); }
.price b { font-weight: 800; white-space: nowrap; }
.body { margin-top: calc(var(--u) * 4); font-size: calc(var(--u) * 3.6); line-height: 1.45; }
.foot { margin-top: calc(var(--u) * 5); }
.cta { display: inline-block; background: var(--accent); color: #fff; font-size: calc(var(--u) * 5); font-weight: 800;
  padding: calc(var(--u) * 2.4) calc(var(--u) * 5); border-radius: calc(var(--u) * 1.5); }
.contact { margin-top: calc(var(--u) * 3.5); font-size: calc(var(--u) * 3.6); font-weight: 600; line-height: 1.5; }
</style>
</head>
<body>
<div class="page">
  <div class="bg"></div><div class="shade"></div><div class="band"></div>
  <div class="content">
    <div class="hero">
      {{KICKER}}
      <h1>{{TITLE}}</h1>
      {{SUBTITLE}}
      {{DETAILS}}
      {{PRICES}}
      {{BODY}}
    </div>
    <div class="foot">
      {{CTA}}
      {{CONTACT}}
    </div>
  </div>
</div>
<script>
// shrink the whole design a little at a time until everything fits on the page
(function(){var pg=document.querySelector('.page'),c=document.querySelector('.content');
var u=parseFloat(getComputedStyle(pg).getPropertyValue('--u'));
for(var i=0;i<40&&c.scrollHeight>pg.clientHeight+1;i++){u*=0.96;pg.style.setProperty('--u',u+'px');}})();
</script>
</body>
</html>
